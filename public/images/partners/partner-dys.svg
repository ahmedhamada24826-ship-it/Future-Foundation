<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">DYS partner logo</title>
  <desc id="desc">A green circular emblem with DYS branding.</desc>
  <defs>
    <radialGradient id="g" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#31c48d"/>
      <stop offset="100%" stop-color="#1a7f4f"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="#effbf5"/>
  <circle cx="256" cy="256" r="188" fill="url(#g)" stroke="#0f172a" stroke-width="10"/>
  <circle cx="256" cy="256" r="154" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.8"/>
  <g fill="#ffffff" font-family="Arial, sans-serif" font-weight="800" text-anchor="middle">
    <text x="256" y="250" font-size="108">DYS</text>
  </g>
  <g fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    <text x="256" y="300">شباب الدلتا</text>
  </g>
  <g fill="#ffffff" font-family="Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    <text x="256" y="323">وزارة الشباب والرياضة</text>
  </g>
</svg>
